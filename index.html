<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موزیک پلیر پیشرفته</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            /* هماهنگی خودکار با تم تاریک و روشن تلگرام */
            --bg-color: var(--tg-theme-bg-color, #1c1c1d);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #999999);
            --button-color: var(--tg-theme-button-color, #8a2be2); /* رنگ بنفش جذاب */
            --button-text: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #2c2c2e);
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: Tahoma, Arial, sans-serif;
            margin: 0;
            padding: 15px;
            padding-bottom: 100px; /* فضای خالی برای پلیر پایین صفحه */
        }
        .header { text-align: center; margin-bottom: 20px; font-weight: bold; font-size: 22px; color: var(--text-color);}
        .search-box {
            display: flex; gap: 10px; margin-bottom: 20px;
        }
        input {
            flex: 1; padding: 15px; border: 1px solid var(--hint-color); border-radius: 12px;
            background-color: var(--secondary-bg); color: var(--text-color); outline: none; font-size: 15px;
        }
        button.search-btn {
            background-color: var(--button-color); color: var(--button-text);
            border: none; padding: 0 20px; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 15px;
        }
        .track-list { display: flex; flex-direction: column; gap: 15px; }
        .track-item {
            display: flex; align-items: center; background: var(--secondary-bg);
            padding: 12px; border-radius: 15px; gap: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .track-item img { width: 70px; height: 70px; border-radius: 10px; object-fit: cover; }
        .track-info { flex: 1; overflow: hidden; }
        .track-title { font-weight: bold; font-size: 15px; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-artist { font-size: 13px; color: var(--hint-color); }
        .actions { display: flex; flex-direction: column; gap: 8px; }
        .btn-play { background: #1db954; color: white; border: none; padding: 8px 15px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; }
        .btn-dl { background: var(--button-color); color: white; border: none; padding: 8px 15px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; }
        
        /* پلیر ثابت در پایین صفحه */
        .player-container {
            position: fixed; bottom: 0; left: 0; right: 0; background: var(--secondary-bg);
            padding: 15px 20px; border-top: 1px solid rgba(255,255,255,0.1); display: none;
            flex-direction: column; gap: 10px; box-shadow: 0 -5px 20px rgba(0,0,0,0.3);
            border-top-left-radius: 20px; border-top-right-radius: 20px;
        }
        .player-header { display: flex; justify-content: space-between; font-size: 14px; font-weight: bold; margin-bottom: 5px;}
        audio { width: 100%; height: 40px; outline: none; }
        #loading { text-align: center; color: var(--hint-color); display: none; font-weight: bold; margin-top: 20px;}
    </style>
</head>
<body>

    <div class="header">🎧 اپلیکیشن موزیک من</div>
    
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="نام آهنگ یا خواننده را بنویسید...">
        <button class="search-btn" onclick="searchMusic()">جستجو</button>
    </div>

    <div id="loading">در حال جستجو در دیتابیس جهانی... ⏳</div>
    <div class="track-list" id="trackList"></div>

    <!-- پلیر مخفی که موقع پخش میاد بالا -->
    <div class="player-container" id="playerContainer">
        <div class="player-header">
            <span id="nowPlayingText">در حال پخش...</span>
            <span onclick="closePlayer()" style="color:#ff4757; cursor:pointer;">❌ بستن</span>
        </div>
        <audio id="audioPlayer" controls controlsList="nodownload"></audio>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // تابع جستجو در اپل موزیک
        async function searchMusic() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return tg.showAlert("لطفاً یک نام وارد کنید!");
            
            const trackList = document.getElementById('trackList');
            const loading = document.getElementById('loading');
            
            trackList.innerHTML = '';
            loading.style.display = 'block';
            closePlayer();

            try {
                // اتصال به دیتابیس رایگان آیتونز برای جستجوی سریع
                const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=15`);
                const data = await response.json();
                loading.style.display = 'none';

                if (data.results.length === 0) {
                    trackList.innerHTML = '<div style="text-align:center; color:var(--hint-color); margin-top:20px;">نتیجه‌ای یافت نشد 😔</div>';
                    return;
                }

                data.results.forEach(track => {
                    // دریافت عکس با کیفیت بالا
                    const coverUrl = track.artworkUrl100.replace('100x100bb', '300x300bb');
                    
                    const item = document.createElement('div');
                    item.className = 'track-item';
                    item.innerHTML = `
                        <img src="${coverUrl}" alt="cover">
                        <div class="track-info">
                            <div class="track-title">${track.trackName}</div>
                            <div class="track-artist">${track.artistName}</div>
                        </div>
                        <div class="actions">
                            <button class="btn-play" onclick="playPreview('${track.previewUrl}', '${track.trackName.replace(/'/g, "\\'")}')">▶️ پخش</button>
                            <button class="btn-dl" onclick="sendToBot('${track.trackName.replace(/'/g, "\\'")}', '${track.artistName.replace(/'/g, "\\'")}')">📥 کامل</button>
                        </div>
                    `;
                    trackList.appendChild(item);
                });
            } catch (error) {
                loading.style.display = 'none';
                tg.showAlert("خطا در اتصال. لطفاً اینترنت خود را چک کنید.");
            }
        }

        // تابع پخش آنلاین موزیک در مینی‌اپ
        function playPreview(url, title) {
            const playerContainer = document.getElementById('playerContainer');
            const audioPlayer = document.getElementById('audioPlayer');
            const nowPlayingText = document.getElementById('nowPlayingText');

            if (!url) return tg.showAlert("متأسفانه این آهنگ قابلیت پخش آنلاین ندارد.");

            nowPlayingText.innerText = "▶️ " + title;
            audioPlayer.src = url;
            playerContainer.style.display = 'flex';
            audioPlayer.play();
        }

        // تابع بستن پلیر
        function closePlayer() {
            const playerContainer = document.getElementById('playerContainer');
            const audioPlayer = document.getElementById('audioPlayer');
            audioPlayer.pause();
            playerContainer.style.display = 'none';
        }

        // ارسال دستور دانلود به ربات پایتون
        function sendToBot(title, artist) {
            const query = title + " - " + artist;
            tg.sendData(query);
        }
    </script>
</body>
</html>
